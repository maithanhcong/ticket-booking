version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ticket_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ticket_admin
      POSTGRES_PASSWORD: ticket_secure_password
      POSTGRES_DB: ticket_booking_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_admin -d ticket_booking_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ticket_network

  redis:
    image: redis:7-alpine
    container_name: ticket_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "redis_secure_password"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_secure_password", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ticket_network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: ticket_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ticket_mq_admin
      RABBITMQ_DEFAULT_PASS: ticket_mq_password
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Management Web UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticket_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  ticket_network:
    driver: bridge
