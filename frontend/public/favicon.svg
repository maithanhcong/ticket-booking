<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="auraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#ef4444" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Sleek dark base badge -->
  <rect width="32" height="32" rx="8" fill="#09090b"/>
  
  <!-- Glowing Ticket Silhouette with Aura Gradient -->
  <g filter="url(#glow)" transform="translate(4, 5)">
    <!-- Ticket Body with Dual Notch Cuts -->
    <path d="M 1 3 C 1 1.895 1.895 1 3 1 L 21 1 C 22.105 1 23 1.895 23 3 L 23 8.5 C 21.62 8.5 20.5 9.62 20.5 11 C 20.5 12.38 21.62 13.5 23 13.5 L 23 19 C 23 20.105 22.105 21 21 21 L 3 21 C 1.895 21 1 20.105 1 19 L 1 13.5 C 2.38 13.5 3.5 12.38 3.5 11 C 3.5 9.62 2.38 8.5 1 8.5 Z" fill="url(#auraGrad)"/>
    
    <!-- Dashed stub tear-line -->
    <line x1="8" y1="3" x2="8" y2="19" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="2 1.5" stroke-opacity="0.85"/>
    
    <!-- Dynamic Star Shimmer -->
    <polygon points="15.5,5.5 16.7,9 20,10.5 16.7,12 15.5,15.5 14.3,12 11,10.5 14.3,9" fill="#ffffff"/>
  </g>
</svg>
